# Ported from yukkcat/chatgpt2api (AGPL-3.0-only).
# 本地 PostgreSQL 容器叠加文件，与 docker-compose.yml（或 docker-compose.warp.yml）一起使用：
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# 需要在 .env 中设置 POSTGRES_PASSWORD（仅限字母、数字和 . _ ~ - ，会拼进 DATABASE_URL）。
# 账号、日志等业务数据存入 PostgreSQL；图片文件仍在 ./data 挂载卷中。
services:
  postgres:
    image: postgres:18-alpine
    container_name: chatgpt2api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatgpt2api}
      POSTGRES_USER: ${POSTGRES_USER:-chatgpt2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - chatgpt2api-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chatgpt2api}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-chatgpt2api}"

volumes:
  chatgpt2api-postgres-data:
